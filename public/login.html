<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>">
<style>
  :root { --ink: #ecebf2; --muted: #9a99a6; --faint: #66657a; --glass: rgba(24, 25, 32, .82); --glassLine: rgba(255,255,255,.07); --accent: #ff8a3d; --error: #f0675d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
    background: radial-gradient(1200px 700px at 30% 20%, #171a26 0%, #0d0e12 60%);
    display: grid; place-items: center; padding: 16px;
  }
  .card { width: 100%; max-width: 360px; padding: 28px 26px 24px; background: var(--glass); border: 1px solid var(--glassLine); border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .logo { display: inline-flex; gap: 2px; }
  .logo i { width: 9px; height: 13px; border-radius: 50% 50% 45% 45%; display: inline-block; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  input { width: 100%; padding: 10px 12px; margin: 0 0 14px; border-radius: 10px; border: 1px solid var(--glassLine); background: rgba(255,255,255,.04); color: var(--ink); font: inherit; outline: none; }
  input:focus { border-color: rgba(255,138,61,.55); box-shadow: 0 0 0 3px rgba(255,138,61,.15); }
  button { width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--accent); color: #15151a; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { min-height: 18px; margin: 12px 0 0; color: var(--error); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1><span class="logo" aria-hidden="true"><i style="background:#8b5cf6"></i><i style="background:#ff7417"></i><i style="background:#ff4fa3"></i></span>Office<small style="color:#888;font-weight:500;font-size:12px;margin-left:8px">Swart Ops</small></h1>
  <p class="sub">Sign in to continue</p>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="go">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true;
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ email: f.email.value, password: f.password.value }) });
      if (r.ok) { try { sessionStorage.setItem('officeBgmUnlock', '1'); } catch {} location.replace('/'); return; }
      err.textContent = 'Invalid email or password';
      f.password.value = ''; f.password.focus();
    } catch { err.textContent = 'Network error — try again'; }
    go.disabled = false;
  });
</script>
</body>
</html>
